<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCP Firewall</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <div class="logo"><i aria-hidden="true"></i><span>MCP Firewall</span></div>
      <nav class="nav" aria-label="Ana menü">
        <button data-view="overview">Genel bakış</button>
        <button data-view="events">Olaylar</button>
        <button data-view="ml">ML</button>
      </nav>
      <div class="top-tools">
        <label class="pill-select">
          <select id="server-filter" aria-label="Sunucu filtresi"><option value="">Tüm sunucular</option></select>
        </label>
        <button class="icon-btn" id="bell" aria-label="Bildirimler"></button>
        <span class="status" id="live" title="Audit logu her 5 saniyede okunur"><i aria-hidden="true"></i><span id="mode-badge">canlı</span></span>
      </div>
    </div>
  </header>

  <main>
    <h1 class="sr-only" id="title">Genel bakış</h1>
    <section class="view overview" id="view-overview" aria-label="Genel bakış"></section>
    <section class="view wrap events" id="view-events" aria-label="Olaylar" hidden></section>
    <section class="view wrap mlv" id="view-ml" aria-label="ML olayları" hidden></section>
  </main>
  <footer class="wrap foot" id="foot"></footer>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
